# Project-wide Gradle settings.

# JVM args for the Gradle daemon. 2g is plenty for this two-module build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent modules in parallel and cache task outputs across builds.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style for the IDE.
kotlin.code.style=official

# AndroidX — required by every dependency in this project.
android.useAndroidX=true

# Only generate the resource symbols actually used (smaller R classes, faster builds).
android.nonTransitiveRClass=true
